<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #141317;
            color: #e5e1e7;
            font-family: 'Manrope', sans-serif;
        }
        /* Custom scrollbar for deep noir feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #141317;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b292d;
            border-radius: 10px;

    body {
      min-height: max(884px, 100dvh);

<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<nav class="bg-[#141317] dark:bg-[#141317] flex justify-between items-center w-full px-6 h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:bg-[#2b292d] transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[#cfbcff]">arrow_back</span>
</button>
</div>
<h1 class="text-2xl font-black tracking-tighter text-[#cfbcff] font-headline uppercase">New Album</h1>
<div class="flex items-center">
<button class="hover:bg-[#2b292d] transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[#cfbcff]">search</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-2xl mx-auto px-6 pt-8 pb-32">
<header class="mb-10 text-center md:text-left">
<div class="inline-block px-3 py-1 bg-primary-container/20 rounded-full mb-4">
<span class="text-primary text-[10px] font-bold uppercase tracking-widest font-label">Digital Archivist</span>
</div>
<h2 class="text-4xl font-black font-headline text-on-surface leading-none mb-2">CATALOG ENTRY</h2>
<p class="text-on-surface-variant font-body text-sm max-w-md">Add a new high-fidelity record to the collector's vault. Ensure all metadata matches the physical pressing for archival accuracy.</p>
</header>
<!-- Asymmetric Form Layout -->
<form class="space-y-8">
<!-- Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Album Name -->
<div class="md:col-span-2">
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Album Name</label>
<input class="w-full bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="e.g. Kind of Blue" type="text"/>
</div>
<!-- Cover Image URL -->
<div class="md:col-span-2">
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Cover Image URL</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="https://images.vinyl.com/cover-art.jpg" type="url"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline/30 group-focus-within:text-primary transition-colors">image</span>
</div>
</div>
<!-- Release Year -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Release Year</label>
<input class="w-full bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="1959" type="text"/>
</div>
<!-- Genre Dropdown -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Genre</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
<option disabled="" hidden="" selected="" value="">Select Genre</option>
<option class="bg-surface">Classical</option>
<option class="bg-surface">Salsa</option>
<option class="bg-surface">Rock</option>
<option class="bg-surface">Folk</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 pointer-events-none text-primary">expand_more</span>
</div>
</div>
<!-- Record Label -->
<div class="md:col-span-2">
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Record Label</label>
<input class="w-full bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="Columbia Records" type="text"/>
</div>
<!-- Description -->
<div class="md:col-span-2">
<label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-primary mb-2 ml-1">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-primary-container rounded-lg py-4 px-5 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all resize-none" placeholder="Brief history or aesthetic notes about this pressing..." rows="4"></textarea>
</div>
</div>
<!-- Action Cluster -->
<div class="pt-8 flex flex-col gap-4">
<button class="w-full bg-primary-container text-secondary py-5 rounded-lg font-headline font-extrabold uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all shadow-[0px_8px_24px_rgba(103,80,164,0.3)]" type="submit">
                    Save Album
                </button>
<button class="w-full py-3 text-outline hover:text-on-surface font-body font-bold transition-colors active:scale-[0.98]" type="button">
                    Cancel
                </button>
</div>
</form>
<!-- Visual Flavour Element -->
<div class="mt-16 flex justify-center opacity-10">
<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'FILL' 1;">album</span>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-4 pt-2 bg-[#141317]/70 backdrop-blur-md z-50 shadow-[0px_-4px_16px_rgba(0,0,0,0.4)]">
<!-- Albums (Active) -->
<a class="flex flex-col items-center justify-center bg-[#6750a4] text-[#fff9ef] rounded-xl px-5 py-1.5 scale-95 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">library_music</span>
<span class="text-[11px] font-bold uppercase tracking-widest mt-1">Albums</span>
</a>
<!-- Artists -->
<a class="flex flex-col items-center justify-center text-[#fff9ef] opacity-50 px-5 py-1.5 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">person_filled</span>
<span class="text-[11px] font-bold uppercase tracking-widest mt-1">Artists</span>
</a>
<!-- Collectors -->
<a class="flex flex-col items-center justify-center text-[#fff9ef] opacity-50 px-5 py-1.5 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">group</span>
<span class="text-[11px] font-bold uppercase tracking-widest mt-1">Collectors</span>
</a>
</nav>

</body></html>
